spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    # 기본값 true 면 뷰 렌더링 중에도 DB 커넥션을 붙들고 있어, 부하가 몰릴 때 커넥션 풀이
    # 먼저 마른다. 이 앱은 전부 JSON 응답이라 뷰 렌더링 단계가 필요 없다.
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      # Railway 는 접속정보를 REDIS_URL 하나로 준다(redis://default:<pw>@host:port). host/port 만
      # 받던 예전 설정으로는 비밀번호를 넣을 자리가 없었다. 로컬에서는 REDIS_URL 이 없으므로
      # host/port 로 같은 모양의 URL 을 만들어 쓴다.
      url: ${REDIS_URL:redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}}
  mail:
    # 이 블록이 없으면 spring-boot-starter-mail 의 자동설정이 JavaMailSender 빈을 아예 만들지
    # 않는다(spring.mail.host 조건부). 그러면 EmailAuthManager 생성자 주입이 실패해서
    # "No qualifying bean of type JavaMailSender" 로 컨텍스트 기동 자체가 죽는다.
    # 자격증명은 비어 있어도 기동은 되게 둔다 - 못 보내는 건 런타임에 드러나면 된다.
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  output:
    ansi:
      # 컨테이너 로그에 ANSI 이스케이프가 섞이면 journald/Railway 로그가 읽기 어려워진다.
      enabled: ${OUTPUT_ANSI_ENABLED:never}
  lifecycle:
    timeout-per-shutdown-phase: 20s
logging:
  file:
    encoding: UTF-8
  level:
    com.soundsleeper.app: ${LOG_LEVEL_APP:INFO}
    # 메일 디버그는 SMTP 핸드셰이크를 그대로 찍는다. 운영에서는 끈다.
    org.springframework.mail: ${LOG_LEVEL_MAIL:WARN}
    javax.mail: ${LOG_LEVEL_MAIL:WARN}

# 플랫폼 헬스체크용. health 만 노출한다 - env/beans/configprops 까지 열면 설정값이 샌다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      # SMTP 는 이 서비스의 가동 조건이 아니다. 켜 두면 메일 자격증명이 없거나 Gmail 이
      # 잠깐 흔들릴 때마다 health 가 DOWN 으로 떨어지고, 플랫폼은 멀쩡한 인스턴스를
      # 죽은 것으로 보고 롤백한다. 실제로 자격증명이 비어 있을 때 DOWN 이 나는 것을 확인했다.
      enabled: false

jwt:
  secret-key: ${JWT_SECRET}
  access-token-expiry: ${JWT_ACCESS_EXPIRY}
  refresh-token-expiry: ${JWT_REFRESH_EXPIRY}

channel-talk:
  hash-secret: ${CHANNEL_TALK_HASH_SECRET}

server:
  # Railway/Cloud Run 류는 포트를 PORT 로 주입하고 **헬스체크도 그 포트로** 찌른다.
  # SERVER_PORT 만 읽던 동안에는 컨테이너가 8080 에 떠 있는데 플랫폼은 다른 포트를
  # 찔러 "Application failed to respond" 가 났다. PORT 가 있으면 그게 이기고,
  # 없으면 로컬 .env 의 SERVER_PORT, 그것도 없으면 8080.
  port: ${PORT:${SERVER_PORT:8080}}
  address: ${SERVER_ADDRESS:0.0.0.0}
  forward-headers-strategy: framework
  # 재배포 때 SIGTERM 으로 인플라이트 요청이 잘리지 않게 한다.
  shutdown: graceful
app:
  base-url: ${APP_BASE_URL}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  auth:
    email:
      code-prefix: "AUTH_CODE:"
      code-expiration-time: 180
      from-email: ${MAIL_USERNAME:}
      subject: "[수면 앱] 이메일 인증 번호 안내"
  google-play:
    package-name: ${GOOGLE_PLAY_PACKAGE_NAME}
    service-account-key-path: ${GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_PATH:}
    # 운영용. 키 JSON 을 base64 한 줄로 넣는다. 둘 다 있으면 이쪽이 이긴다.
    service-account-key-json: ${GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_B64:}
    rtdn-audience: ${GOOGLE_PLAY_RTDN_AUDIENCE:}
    rtdn-allowed-service-account-email: ${GOOGLE_PLAY_RTDN_SA_EMAIL:}
asleep:
  api:
    key: ${ASLEEP_API_KEY}
    base-url: ${ASLEEP_BASE_URL}
    callback-url: ${ASLEEP_CALLBACK_URL:}
    service-name: ${ASLEEP_SERVICE_NAME}
ai:
  advice:
    # api-key 매핑이 빠져 있어서 AiAdviceClient 가 빈 키를 받고 LLM 호출을 통째로
    # 건너뛰고 있었다(= /api/sleep-advice 가 항상 5xx). 모델만 정해 둬도 소용이 없다.
    api-key: ${AI_ADVICE_API_KEY:}
    model: ${AI_ADVICE_MODEL:gpt-4o-mini}
    base-url: ${AI_ADVICE_BASE_URL:https://api.openai.com/v1/chat/completions}
