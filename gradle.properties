android.enableProfileInstaller=true
android.no-crypto-signing-rollback=false
android.nonTransitiveRClass=true

org.gradle.daemon = true
org.gradle.parallel=true
org.gradle.configureondemand = true

android.useAndroidX=true
android.r8.optimizedResourceShrinking=true
android.disallowKotlinSourceSets=false
android.builtInKotlin=false
android.newDsl=false






org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon.idletimeout=3600
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

kotlin.daemon.jvm.options=-Xmx2g
kotlin.code.style=official
kotlin.jvm.target.validation.mode=warning

ksp.useK2=true
ksp.incremental.apt=true
ksp.incremental.log=false
ksp.room.incremental=true
ksp.room.expandProjection=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
