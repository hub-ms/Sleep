android.enableProfileInstaller=true
android.no-crypto-signing-rollback=false
android.nonTransitiveRClass=true

org.gradle.daemon = true
org.gradle.parallel=true

android.useAndroidX=true
android.disallowKotlinSourceSets=false






org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon.idletimeout=3600
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

kotlin.daemon.jvm.options=-Xmx2g
kotlin.code.style=official
kotlin.jvm.target.validation.mode=warning

ksp.useK2=true
ksp.incremental.apt=true
ksp.incremental.log=false
ksp.room.incremental=true
ksp.room.expandProjection=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
